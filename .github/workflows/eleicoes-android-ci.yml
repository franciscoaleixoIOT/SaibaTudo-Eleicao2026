name: Eleições — Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths: [ "apps/eleicoes2026/**", "!apps/eleicoes2026/web/**", "!apps/eleicoes2026/api/**", "!apps/eleicoes2026/backend/**", "!apps/eleicoes2026/docs/**", "!apps/eleicoes2026/store/**", ".github/workflows/eleicoes-android-ci.yml" ]
  pull_request:
    paths: [ "apps/eleicoes2026/**", "!apps/eleicoes2026/web/**", "!apps/eleicoes2026/api/**", "!apps/eleicoes2026/backend/**", "!apps/eleicoes2026/docs/**", "!apps/eleicoes2026/store/**", ".github/workflows/eleicoes-android-ci.yml" ]

defaults:
  run:
    working-directory: apps/eleicoes2026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão do gradlew
        run: chmod +x gradlew

      # Os testes usam os dados REAIS do snapshot (data/eleicoes2026): integridade, assinatura, NLU, respostas, atualizador
      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint (release)
        run: ./gradlew lintRelease --no-daemon

      - name: Bundle e APK de release (sem assinatura em PR)
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # O 1º release assinado crashou ao abrir porque o R8 removeu classes criadas por reflexão (Room/WorkManager): testes unitários e debug não
      # pegaram. Esta checagem lê o dex do APK de release e confere as classes obrigatórias (tools/verificar_release.py); não substitui o teste em aparelho.
      - name: Verificar o release minificado (classes por reflexão presentes)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          python3 tools/verificar_release.py "$APK"

      - name: Relatórios de teste e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: |
            apps/eleicoes2026/app/build/reports/tests/testDebugUnitTest
            apps/eleicoes2026/app/build/reports/lint-results-release.html

      - name: Artefatos de release (não assinados)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-nao-assinado
          path: |
            apps/eleicoes2026/app/build/outputs/bundle/release/*.aab
            apps/eleicoes2026/app/build/outputs/apk/release/*.apk

  # Release assinado com a chave de UPLOAD (somente em tags vX.Y.Z e com os segredos configurados)
  release-assinado:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      SAIBATUDO_STORE_FILE: secrets/upload-keystore.p12
      SAIBATUDO_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      SAIBATUDO_KEY_ALIAS: upload
      SAIBATUDO_KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Restaurar keystore de upload
        run: |
          mkdir -p secrets
          echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > secrets/upload-keystore.p12
      - run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-assinado
          path: apps/eleicoes2026/app/build/outputs/bundle/release/*.aab
