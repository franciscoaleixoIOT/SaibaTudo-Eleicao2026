name: Eleições — Web e API CI

on:
  push:
    branches: [ "main" ]
    paths: [ "apps/eleicoes2026/web/**", "apps/eleicoes2026/api/**", "apps/eleicoes2026/backend/**", "apps/eleicoes2026/pipeline/**", "apps/eleicoes2026/data/**", "apps/eleicoes2026/contracts/**", "apps/eleicoes2026/tools/**", "apps/eleicoes2026/eval/**", "apps/eleicoes2026/ai_model/scripts/**", "apps/eleicoes2026/vercel.json", ".github/workflows/eleicoes-web-ci.yml" ]
  pull_request:
    paths: [ "apps/eleicoes2026/web/**", "apps/eleicoes2026/api/**", "apps/eleicoes2026/backend/**", "apps/eleicoes2026/pipeline/**", "apps/eleicoes2026/data/**", "apps/eleicoes2026/contracts/**", "apps/eleicoes2026/tools/**", "apps/eleicoes2026/eval/**", "apps/eleicoes2026/ai_model/scripts/**", "apps/eleicoes2026/vercel.json", ".github/workflows/eleicoes-web-ci.yml" ]

defaults:
  run:
    working-directory: apps/eleicoes2026

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do site/PWA (NLU, filtros, respostas, integridade dos dados)
        run: node --test "web/test/*.test.mjs"   # glob: o Node 22 não aceita pasta
      - name: Testes da API (normalização, validação, rate limit, CORS)
        run: node --test "api/test/*.test.mjs"
      - name: Testes do retreino (rotulador de perguntas externas e coletor de relatos)
        run: node --test "backend/retrain/*.test.mjs"
      - name: Testes do guarda de congelamento
        run: node --test tools/congelamento.test.mjs
      - name: Build do site
        run: node web/build.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do pipeline de dados e do backend de IA (Python)
        run: |
          pip install -r pipeline/requirements.txt pyyaml==6.0.2   # pyyaml: tools/test_workflows.py valida os workflows
          python -m unittest discover -s pipeline/tests
          python -m unittest discover -s tools -p "test_*.py"
          python -m unittest discover -s ai_model/scripts -p "test_treino*.py"
          python -m unittest discover -s backend/modal -p "test_*.py"
          python -m unittest discover -s backend/retrain -p "test_*.py"
