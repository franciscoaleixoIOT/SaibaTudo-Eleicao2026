name: Hugging Face Model Pipeline CI

on:
  push:
    paths:
      - 'ai_model/**'
  pull_request:
    paths:
      - 'ai_model/**'

jobs:
  validate_pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Lint & Validation Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Validate Dataset Generation Script
      run: |
        python ai_model/scripts/dataset_generator.py

    - name: Lint Python Code
      run: |
        flake8 ai_model/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
