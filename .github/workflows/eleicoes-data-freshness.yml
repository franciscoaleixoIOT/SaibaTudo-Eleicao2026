name: Eleições — Alerta de frescor dos dados

# Vigia o que o eleitor vê: manifesto publicado (idade da extração do TSE e assinatura) e a saúde do data_refresh.
# Abre UMA issue "alerta-dados" quando algo falha e a fecha sozinho quando volta ao normal. Motivo: em 05/10/2026 o
# data_refresh falhou 18 vezes seguidas (~9 h) e os resultados do 1º turno não chegaram a ninguém, sem aviso.
# Regras e limites: tools/frescor.py.
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: eleicoes-data-freshness
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/eleicoes2026

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://saibatudo.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/eleicoes2026/pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Avaliar
        id: avaliar
        run: |
          gh run list --workflow eleicoes-data-refresh.yml --limit 10 --json conclusion,status,createdAt > runs.json
          set +e
          python tools/frescor.py \
            --manifest-url "$SITE/data/eleicoes2026/manifest.json" \
            --assinatura-url "$SITE/data/eleicoes2026/manifest.sig" \
            --runs runs.json --saida resultado.json
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat resultado.json

      - name: Abrir, atualizar ou fechar a issue
        run: |
          gh label create alerta-dados --color B60205 --description "Dados oficiais atrasados ou inválidos (automático)" 2>/dev/null || true
          ABERTA=$(gh issue list --label alerta-dados --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.avaliar.outputs.codigo }}" != "0" ]; then
            PROBLEMAS=$(python -c "import json;print('\n'.join('- '+p for p in json.load(open('resultado.json'))['problemas']))")
            CORPO=$(printf 'Detectado em %s.\n\n%s\n\n**O que olhar:** a aba Actions (workflow "Atualização dos dados oficiais"), o passo que falhou, e https://saibatudo.net/api/health.\n\n_Esta issue é aberta e fechada automaticamente por eleicoes-data-freshness.yml._' "$(date -u +%Y-%m-%dT%H:%MZ)" "$PROBLEMAS")
            if [ -z "$ABERTA" ]; then
              gh issue create --title "Alerta: dados oficiais atrasados ou inválidos" --label alerta-dados --body "$CORPO"
            else
              echo "já existe a issue #$ABERTA aberta: sem novo comentário (evita ruído a cada 30 min)"
            fi
          elif [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body "Normalizado em $(date -u +%Y-%m-%dT%H:%MZ): dados frescos e assinatura válida."
            gh issue close "$ABERTA"
          fi

      - name: Falhar o job quando há problema (aparece na aba Actions e no e-mail do GitHub)
        if: steps.avaliar.outputs.codigo != '0'
        run: exit 1
